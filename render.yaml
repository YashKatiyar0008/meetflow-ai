services:
  - type: web
    name: meetflow-ai
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: MEETFLOW_DATA_FILE
        value: /tmp/meetflow-memory.json
      - key: SARVAM_MODEL
        value: sarvam-105b
      - key: SARVAM_API_KEY
        sync: false
